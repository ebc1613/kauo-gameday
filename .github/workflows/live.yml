# Live game-day snapshot: every 10 minutes on Fri/Sat/Sun, live.py checks live_days.json and only
# does work on home-game weekends between 6 am and 11 pm Central. Public repo, so Actions is free.
name: live
on:
  schedule:
    - cron: "*/10 * * * 5,6,0"
  workflow_dispatch:
permissions:
  contents: write
concurrency: live
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot traffic near KAUO
        run: python3 live.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Publish
        run: |
          git config user.name "KAUO live"
          git config user.email "ebc1613@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || { git commit -q -m "Live snapshot"; git pull -q --rebase; git push -q; }
